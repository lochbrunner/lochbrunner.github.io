about:
  name: Matthias Lochbrunner
  title: Research Engineer
  affiliation: Google DeepMind
  # tagline: Building intelligent systems that push the boundaries of AI capabilities.
  # bio: >
  #   I am a Research Engineer at Google DeepMind working on advancing reasoning capabilities of Gemini.
  #   With a background in Physics and Mathematics, I have a strong foundation in both theoretical and applied aspects of machine learning and software development.
  
  #   My work focuses on developing novel methods for improving the reasoning and coding capabilities of large language models.
  #   I am passionate about creating technologies that empower developers and researchers to solve complex problems more effectively.
  tagline: Executing the next generation of Gemini reasoning systems.
  bio: >
      I am a Research Engineer at Google DeepMind on the Gemini team, where I focus on improving reasoning and coding capabilities.
      I have a proven track record of translating complex research ideas into robust, workable implementations.

      My background combines the rigor of theoretical physics with over a decade of hands-on coding experience.
      Whether it was developing perception stacks for self-driving cars or scaling agentic frameworks for Gemini, my work is centered on execution.
      I bring the mathematical depth to understand "why" and the engineering precision to deliver "how."

research_interests:
  - Machine Learning
  - Symbolic Reasoning
  - Reinforcement Learning
  - Compiler Design
  - Neural Network Architecture


projects:
  - id: "2024"
    title: Chop Language Compiler
    description: >
      A compiler for the novel programming language Chop, which combines the expressivity
      of Scala with the performance of C and security features of Rust.
    technologies:
      - Rust
      - WebAssembly
      - Claude Code
    live_url: /chop
    featured: false

  - id: "2021"
    title: Rule based Symbolic Reasoning
    description: >
      Symbolic reasoning has gained significant attention recently.
      A new method, which uses rule applications in an RL setup,
      could lead to a dependable and strong algebra system by solving
      a critical challenge in the field. In school, we learn basic algebraic
      rules to solve simple problems. These rules provide us with various
      paths to find the solution.
    technologies:
      - PyTorch
      - Python
      - Rust
      - C++
      - CUDA
    images:
      - /images/symbolic-reasoning.gif
    github_url: https://github.com/lochbrunner/symbolic-reasoning
    featured: true

  - id: "2018"
    title: Editor for Neural Network Architectures
    description: >
      An online platform where users can design, train, and share AI models.
      The platform features a no-code editor that allows users to design
      network architecture and visualize hidden neuron states live on a canvas.
    technologies:
      - TypeScript
      - React
      - Redux
      - TensorFlow.js
    images:
      - https://raw.githubusercontent.com/lochbrunner/open-go-bot/master/docs/assets/mnist/mnist.gif
    live_url: https://lochbrunner.github.io/demos/social-ai/#/scenario/mnist
    github_url: https://lochbrunner.github.io/demos/social-ai/#/scenario/mnist
    featured: false

  - id: "2018"
    title: Charlie Debugger
    description: >
      This project encompasses the development of a compiler, interpreter,
      and VS Code debug adapter for the Charlie programming language, a subset of C.
      All components, with the exception of the VS Code extension, are built from
      the ground up without the use of external libraries, serving an educational purpose.
      The compiler's function is to parse source code and generate corresponding byte-code.
      Subsequently, the interpreter reads the byte-code and can initiate a TCP socket
      connection for the VS Code debugging extension.
    technologies:
      - TypeScript
      - C++
    images: []
    github_url: https://github.com/lochbrunner/charlie
    youtube_url: https://www.youtube.com/embed/bC8TMuqG-oE
    featured: false


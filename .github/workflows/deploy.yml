name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Build the legacy Next.js site first (its out/ is needed by the main build)
      - name: Install legacy dependencies
        run: cd legacy && npm ci

      - name: Build legacy site
        run: cd legacy && npm run build

      # Build the new Vite site (vite-plugin-static-copy bundles chop/ automatically)
      - name: Install dependencies
        run: npm ci

      - name: Build new site
        run: npm run build

      # Copy legacy output into the final bundle
      - name: Copy legacy build to output
        run: |
          mkdir -p out/legacy
          cp -r legacy/out/* out/legacy/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4